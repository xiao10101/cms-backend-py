[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery[redis]>=5.3",
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dev = "app.cli:dev"
seed = "scripts.seed:seed"

[build-system]
requires=["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["app"]